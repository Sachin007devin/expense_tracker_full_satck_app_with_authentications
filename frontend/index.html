<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/index.css">
    <title>Expense App</title>
</head>

<body>
    <div class="container">
        <div class="form_container">
            <h3 id="heading">Sign In</h3>
            <form>
                <label for="user_name">Enter Your Name:-</label>
                <input placeholder="Enter Your Name" required type="text" id="user_name" name="user_name" />

                <label for="user_email">Enter Your Email:-</label>
                <input placeholder="Enter Your Email" required type="email" id="user_email" name="user_email" />

                <label for="user_password">Enter Your Password:-</label>
                <input placeholder="Enter Your Password" required type="password" id="user_password"
                    name="user_password" maxlength="12" minlength="8"/>

                <button type="submit">Sign Up</button>
                <a href="./login.html">Existing User?Login Here</a>

            </form>
        </div>
    </div>
</body>
<script src="./js/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.19.0/axios.min.js"></script>

</html>
