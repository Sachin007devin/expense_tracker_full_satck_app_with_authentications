    <title>Expense Tracker App - Loot Pulse</title>

<body>
    <!-- Top Navigation / Premium Banner Bar -->
    <header class="app_header">
        <div class="brand_wrap">
            <span class="brand_icon">⚡</span>
            <h1 class="brand_title">Loot Pulse <span class="badge_sub">TRACKER</span></h1>
        </div>

        <div class="premium" >
            <button id="premium_btn" class="btn_volt_glow">⚡ Buy Premium Features</button>
            <div id="premium_user_feature" style="display: none;">
                <span class="premium_active_badge" >👑 You are a Premium User now</span>
                <button id="show_leaderBoard" class="btn_secondary">🏆 Show LeaderBoard</button>
                <button id="generate_report" class="btn_tertiary">📊 Generate Report</button>
            </div>
        </div>
    </header>

    <main class="dashboard_container">
        <!-- Left Column: Input Form & Pagination Control -->
        <section class="control_section">
            <div class="form_container card_glass">
                <h3>Add New Transaction</h3>
                <form>
                    <div class="input_group">
                        <label for="expense_amount">Choose Expense Amount:</label>
                        <input type="number" required id="expense_amount" placeholder="e.g. 150" name="expense_amount" />
                    </div>

                    <div class="input_group">
                        <label for="expense_description">Enter Description:</label>
                        <input type="text" required id="expense_description" placeholder="e.g. Weekend Matcha & Tacos" name="expense_description" />
                    </div>

                    <div class="form_actions">
                        <button type="submit" id="expns_btn" class="add_expns btn_primary">Add Expense</button>
                        <button type="button" id="income_btn" class="income_expns btn_secondary" disabled="true">Add Income</button>
                    </div>
                </form>
            </div>

            <!-- Rows Control -->
            <div class="pagination_control card_glass">
                <label for="select_number_of_rows">Rows per page:</label>
                <select id="select_number_of_rows">
                    <option value="5" selected>5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>
        </section>

        <!-- Right Column: Tables, Feed & Leaderboard -->
        <section class="telemetry_section">
            <div class="display_list_leaderBoard">
                
                <!-- Expense Table Feed -->
                <div class="expense_list card_glass">
                    <div class="section_title_row">
                        <h3>Active Ledger</h3>
                        <span class="live_tag">Real-time sync</span>
                    </div>
                    
                    <div class="table_responsive">

                    </div>
                    <!-- Fallback unordered list structure in case JS targets ul directly -->
                    <ul style="display: none;"></ul>
                </div>

                <!-- Leaderboard Panel -->
                <div class="leaderBoard card_glass" style="display: none;">
                    <div class="section_title_row">
