<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/forgot_password.css">
    <title>Expense App</title>
</head>

<body>
    <div class="container">
        <div class="form_container">
            <h3 id="heading">Reset Password</h3>
            <form>
               
                <label for="user_email">Enter Your Email:-</label>
                <input placeholder="Enter Your Email" required type="email" id="user_email" name="user_email" />

                <button id="reset_pass_btn" type="submit">Reset password</button>
                <a href="./login.html">Get Back to login</a>

            </form>
        </div>
         <div class="reset_msg" style="display: none;"><span>A Reset Password link is being sent to your provided Email Id</span></div>
    </div>
</body>
<script src="./js/forgot_password.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.19.0/axios.min.js"></script>

</html>
