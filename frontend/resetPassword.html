<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/resetPassword.css">
    <title>Expense App</title>
</head>

<body>
    <div class="container">
        <div class="form_container">
            <h3 id="heading">Set Up New Password</h3>
            <form>

                <label for="user_password">Enter Your Password:-</label>
                <input placeholder="Enter Your Password" required type="password" id="user_password"
                    name="user_password" maxlength="12" minlength="8" />
                    
                <label for="confirm_user_password">ReEnter Your Password:-</label>
                <input placeholder="Enter Your Password" required type="password" id="confirm_user_password"
                    name="confirm_user_password" maxlength="12" minlength="8" />

                <button id="reset_pass_btn" type="submit">Confirm Reseting password</button>

            </form>
        </div>
    </div>
</body>
<script src="./js/resetPassword.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.19.0/axios.min.js"></script>

</html>
